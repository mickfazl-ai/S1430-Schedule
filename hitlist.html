<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S1429/S1430 Hitlist</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap');
  :root{
    --steel-900:#15181c;--steel-850:#1a1e23;--steel-800:#20252b;--steel-700:#2b323a;--steel-600:#3a434d;--line:#39424c;
    --ink:#eef2f5;--ink-dim:#9aa7b2;--ink-faint:#6b7883;--hazard:#f5c518;--hazard-deep:#d9a400;
    --prog:#4f83cc;--done:#5fae7e;--srl:#a97bc4;--wait:#c9556a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:linear-gradient(135deg,#000 0 1px,transparent 1px) 0 0/14px 14px,var(--steel-900);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:60px}
  .wrap{max-width:1600px;margin:0 auto;padding:0 20px}
  .hazbar{height:8px;background:repeating-linear-gradient(45deg,var(--hazard) 0 18px,#111 18px 36px)}
  header{padding:22px 0 16px;border-bottom:1px solid var(--line)}
  .htop{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .machine-id{font-family:'Archivo Narrow';font-weight:700;letter-spacing:.5px;color:var(--hazard);font-size:13px}
  h1{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;margin-top:4px}
  h1 span{color:var(--ink-faint);font-weight:500}
  .nav{display:flex;gap:8px;margin-top:12px}
  .nav a{text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--line);color:var(--ink-dim);background:var(--steel-800)}
  .nav a.on{background:var(--hazard);color:#1a1300;border-color:var(--hazard)}
  .metrics{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--steel-850)}
  .metric{padding:10px 16px;border-right:1px solid var(--line);min-width:92px}
  .metric:last-child{border-right:none}
  .metric .n{font-size:24px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
  .metric .l{font-size:10px;color:var(--ink-dim);font-family:'Archivo Narrow';font-weight:600;letter-spacing:.5px;margin-top:4px;text-transform:uppercase}
  .n.prog{color:var(--prog)} .n.done{color:var(--done)} .n.srl{color:var(--srl)} .n.wait{color:var(--wait)}

  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{background:var(--steel-800);border:none;color:var(--ink-dim);padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--hazard);color:#1a1300}
  select,input[type=search],.inp{background:var(--steel-800);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:12.5px}
  input[type=search]{min-width:200px}
  .btn{background:var(--steel-700);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--hazard)}
  .btn.primary{background:var(--hazard);color:#1a1300;border-color:var(--hazard)}
  .spacer{flex:1}
  .save-note{font-size:11px;color:var(--ink-faint);min-width:54px}
  #syncDot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-faint)}
  #syncDot i{width:9px;height:9px;border-radius:50%;background:var(--ink-faint)}

  /* status pill */
  .st{font-size:10.5px;font-weight:700;font-family:'Archivo Narrow';padding:2px 9px;border-radius:20px;letter-spacing:.3px;white-space:nowrap;cursor:pointer;border:none}
  .st.prog{background:rgba(79,131,204,.18);color:#83ade0}
  .st.done{background:rgba(95,174,126,.18);color:var(--done)}
  .st.srl{background:rgba(169,123,196,.2);color:#c19bd8}
  .st.wait{background:rgba(201,85,106,.2);color:#e08497}

  /* TABLE view */
  .tbl-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:70vh}
  table.jt{border-collapse:collapse;width:100%;min-width:1000px}
  table.jt th{position:sticky;top:0;background:var(--steel-800);z-index:2;text-align:left;padding:9px 10px;font-size:10.5px;font-family:'Archivo Narrow';font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-dim);border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
  table.jt th:hover{color:var(--hazard)}
  table.jt td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}
  table.jt tr:hover td{background:rgba(255,255,255,.02)}
  .mtag{font-size:9.5px;font-weight:700;font-family:'Archivo Narrow';padding:1px 6px;border-radius:3px;background:var(--steel-600);color:var(--ink-dim)}
  .mtag.m1430{background:rgba(245,197,24,.16);color:var(--hazard)}
  .gtag{font-weight:800;font-size:12.5px}
  td[contenteditable]{outline:none;border-radius:3px}
  td[contenteditable]:focus{background:rgba(245,197,24,.08);box-shadow:inset 0 0 0 1px var(--hazard)}
  .xbtn{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:4px}
  .xbtn:hover{color:var(--wait);background:rgba(201,85,106,.12)}
  .sysm{font-size:11px;color:var(--ink-dim)}
  .comm{font-size:11px;color:var(--ink-faint);max-width:260px}

  /* GROUPED view */
  .grp{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;background:var(--steel-850)}
  .grp-h{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;background:var(--steel-800)}
  .grp-h:hover{background:var(--steel-700)}
  .grp-h .gname{font-size:15px;font-weight:800}
  .grp-h .gcount{font-size:11px;color:var(--ink-dim);font-family:'Archivo Narrow';font-weight:600}
  .grp-h .gbar{flex:1;height:6px;background:var(--steel-700);border-radius:4px;overflow:hidden;max-width:280px}
  .grp-h .gbar i{display:block;height:100%;background:var(--done);border-radius:4px}
  .grp-h .gpct{font-size:12px;font-weight:700;color:var(--done);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
  .grp-h .chev{margin-left:auto;color:var(--ink-faint);transition:transform .2s}
  .grp.collapsed .grp-h .chev{transform:rotate(-90deg)}
  .grp.collapsed .grp-body{display:none}
  .grp-body table.jt{min-width:0}

  /* KANBAN view */
  .kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kcol{background:var(--steel-850);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:200px}
  .kcol-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--steel-800);border-radius:8px 8px 0 0}
  .kcol-h .kt{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
  .kcol-h .kdot{width:10px;height:10px;border-radius:50%}
  .kcol-h .kn{font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .kbody{padding:8px;display:flex;flex-direction:column;gap:7px;overflow:auto;max-height:64vh}
  .kcard{background:var(--steel-700);border:1px solid var(--line);border-left:4px solid var(--prog);border-radius:5px;padding:8px 9px;cursor:grab;font-size:12px}
  .kcard[data-s="Done"]{border-left-color:var(--done)}
  .kcard[data-s="At SRL"]{border-left-color:var(--srl)}
  .kcard[data-s="Waiting Parts"]{border-left-color:var(--wait)}
  .kcard.drag{opacity:.4}
  .kcard .kh{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .kcard .kg{font-weight:800;font-size:12px}
  .kcard .ks{font-size:9.5px;color:var(--ink-faint)}
  .kcard .kd{font-size:11.5px;color:var(--ink-dim);margin-top:3px;line-height:1.3}
  .kcol.over{box-shadow:inset 0 0 0 2px var(--hazard)}

  .empty{padding:40px;text-align:center;color:var(--ink-faint);font-size:13px}
  footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:11px;line-height:1.6}
  ::-webkit-scrollbar{height:11px;width:11px}
  ::-webkit-scrollbar-track{background:var(--steel-900)}
  ::-webkit-scrollbar-thumb{background:var(--steel-600);border-radius:6px;border:2px solid var(--steel-900)}
  @media(max-width:900px){.kb{grid-template-columns:1fr 1fr}}

  /* ---------- mobile cards ---------- */
  .cardlist{display:none;flex-direction:column;gap:8px}
  .jcard{background:var(--steel-850);border:1px solid var(--line);border-left:4px solid var(--prog);border-radius:8px;padding:11px 12px;cursor:pointer}
  .jcard[data-s="Done"]{border-left-color:var(--done)}
  .jcard[data-s="At SRL"]{border-left-color:var(--srl)}
  .jcard[data-s="Waiting Parts"]{border-left-color:var(--wait)}
  .jcard .jc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
  .jcard .jc-id{font-weight:800;font-size:14px}
  .jcard .jc-id .mtag{margin-left:6px}
  .jcard .jc-desc{font-size:13px;line-height:1.35;color:var(--ink)}
  .jcard .jc-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}
  .jcard .jc-sys{font-size:11px;color:var(--ink-faint)}

  /* ---------- edit sheet (full-screen on mobile) ---------- */
  .sheet-scrim{position:fixed;inset:0;background:rgba(8,10,12,.72);display:none;z-index:60;align-items:center;justify-content:center;padding:20px}
  .sheet-scrim.on{display:flex}
  .sheet{background:var(--steel-800);border:1px solid var(--line);border-radius:12px;width:100%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .sheet h3{font-size:14px;font-weight:700;padding:15px 18px;border-bottom:1px solid var(--line);font-family:'Archivo Narrow';letter-spacing:.4px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--steel-800);z-index:1}
  .sheet .sc-close{background:none;border:none;color:var(--ink-dim);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
  .sheet .sbody{padding:16px 18px;display:flex;flex-direction:column;gap:13px}
  .sheet .fld{display:flex;flex-direction:column;gap:6px}
  .sheet .fld label{font-size:10.5px;color:var(--ink-dim);font-family:'Archivo Narrow';font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .sheet .fld input,.sheet .fld select,.sheet .fld textarea{background:var(--steel-850);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:11px 12px;font-family:inherit;font-size:15px}
  .sheet .fld textarea{resize:vertical;min-height:60px}
  .sheet .fld.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet .statusrow{display:flex;gap:6px;flex-wrap:wrap}
  .sheet .stbtn{flex:1;min-width:calc(50% - 3px);padding:11px;border-radius:7px;border:1.5px solid var(--line);background:var(--steel-850);color:var(--ink-dim);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .sheet .stbtn.on{border-color:var(--hazard);color:var(--ink);background:rgba(245,197,24,.1)}
  .sheet .sfoot{display:flex;gap:9px;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--steel-800)}
  .sheet .sfoot .btn{flex:1;padding:12px;font-size:14px}

  @media(max-width:700px){
    .wrap{padding:0 12px}
    h1{font-size:24px}
    .metrics{width:100%;overflow-x:auto}
    .metric{min-width:78px;padding:9px 12px}
    .metric .n{font-size:20px}
    .toolbar{gap:7px}
    .toolbar .seg{width:100%}
    .toolbar .seg button{flex:1}
    .toolbar select,.toolbar input[type=search]{flex:1;min-width:calc(50% - 4px)}
    #fSearch{min-width:100%;order:10}
    .spacer{display:none}
    #addJob,#exportXlsx{flex:1}
    .tbl-wrap{display:none}          /* hide table on phone */
    .cardlist{display:flex}          /* show cards on phone */
    .kb{grid-template-columns:1fr}   /* single-column kanban */
    .grp-h .gbar{display:none}
    .sheet{max-width:100%;max-height:100vh;min-height:100vh;border-radius:0}
    .sheet-scrim{padding:0}
  }
  .scrim{position:fixed;inset:0;background:rgba(8,10,12,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .scrim.on{display:flex}
  .modal{background:var(--steel-800);border:1px solid var(--line);border-radius:10px;width:100%;max-width:460px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
  .modal h3{font-size:14px;font-weight:700;padding:14px 18px;border-bottom:1px solid var(--line);font-family:'Archivo Narrow';letter-spacing:.4px;text-transform:uppercase}
  .modal .mbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto}
  .modal .fld{display:flex;flex-direction:column;gap:5px}
  .modal .fld label{font-size:10.5px;color:var(--ink-dim);font-family:'Archivo Narrow';font-weight:700;letter-spacing:.4px;text-transform:uppercase}
  .modal .fld input,.modal .fld select,.modal .fld textarea{background:var(--steel-850);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:8px 10px;font-family:inherit;font-size:13px}
  .modal .fld textarea{resize:vertical;min-height:44px}
  .modal .fld.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="hazbar"></div>
<div class="wrap">
  <header>
    <div class="htop">
      <div>
        <div class="machine-id">HERRENKNECHT · S-1429 &amp; S-1430 · JOB HITLIST</div>
        <h1>Hitlist <span id="jobTotal"></span></h1>
        <div class="nav">
          <a href="index.html">Schedule</a>
          <a href="hitlist.html" class="on">Hitlist</a>
          <a href="crew_admin.html">Crew QR</a>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="n" id="m-total">0</div><div class="l">Jobs</div></div>
        <div class="metric"><div class="n prog" id="m-prog">0</div><div class="l">In progress</div></div>
        <div class="metric"><div class="n wait" id="m-wait">0</div><div class="l">Waiting parts</div></div>
        <div class="metric"><div class="n srl" id="m-srl">0</div><div class="l">At SRL</div></div>
        <div class="metric"><div class="n done" id="m-done">0</div><div class="l">Done</div></div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="viewSeg">
      <button data-v="table" class="on">Table</button>
      <button data-v="grouped">Grouped</button>
      <button data-v="kanban">Kanban</button>
    </div>
    <select id="fMachine"><option value="">All machines</option><option value="1429">S-1429</option><option value="1430">S-1430</option></select>
    <select id="fGantry"><option value="">All gantries</option></select>
    <select id="fSystem"><option value="">All systems</option></select>
    <select id="fStatus"><option value="">All statuses</option><option>In Progress</option><option>Waiting Parts</option><option>At SRL</option><option>Done</option></select>
    <input type="search" id="fSearch" placeholder="Search description / comments…">
    <div class="spacer"></div>
    <button class="btn" id="addJob">+ Job</button>
    <button class="btn" id="exportXlsx">⬇ Excel</button>
    <span class="save-note" id="saveNote"></span>
    <span id="syncDot" title="connecting…"><i></i><span id="syncTxt">local</span></span>
  </div>

  <div id="viewTable"></div>
  <div id="viewGrouped" style="display:none"></div>
  <div id="viewKanban" style="display:none"></div>

  <footer id="foot"></footer>
</div>

<div class="sheet-scrim" id="sheetScrim"><div class="sheet" id="sheet">
  <h3><span id="sh-title">Add job</span><button class="sc-close" id="sh-close">✕</button></h3>
  <div class="sbody">
    <div class="fld row2">
      <div class="fld"><label>Machine</label><select id="sh-machine"><option value="1430">S-1430</option><option value="1429">S-1429</option></select></div>
      <div class="fld"><label>Gantry</label><select id="sh-gantry"></select></div>
    </div>
    <div class="fld"><label>Job #</label><input id="sh-no" placeholder="e.g. 64"></div>
    <div class="fld"><label>Description</label><textarea id="sh-descr" placeholder="What's the job?"></textarea></div>
    <div class="fld"><label>System</label><input id="sh-system" placeholder="e.g. Hosing + Piping"></div>
    <div class="fld"><label>Status</label>
      <div class="statusrow" id="sh-statusrow">
        <button class="stbtn" data-st="In Progress">In Progress</button>
        <button class="stbtn" data-st="Waiting Parts">Waiting Parts</button>
        <button class="stbtn" data-st="At SRL">At SRL</button>
        <button class="stbtn" data-st="Done">Done</button>
      </div>
    </div>
    <div class="fld"><label>Comments</label><textarea id="sh-comments" placeholder="Optional notes"></textarea></div>
  </div>
  <div class="sfoot" style="flex-wrap:wrap">
    <button class="btn" id="sh-sched" style="display:none;border-color:var(--hazard);color:var(--hazard)">→ Add to schedule</button>
    <button class="btn" id="sh-delete" style="color:var(--wait);display:none">Delete</button>
    <button class="btn" id="sh-cancel">Cancel</button>
    <button class="btn primary" id="sh-save">Save</button>
  </div>
</div></div>

<div class="sheet-scrim" id="schedScrim"><div class="sheet" id="schedModal" style="max-width:420px">
  <h3><span>Add to schedule</span><button class="sc-close" id="sc-close">✕</button></h3>
  <div class="sbody">
    <div class="fld"><label>Job</label><div id="sc-jobname" style="font-size:14px;font-weight:700;padding:8px 0"></div></div>
    <div class="fld"><label>Crew</label><select id="sc-crew"></select></div>
    <div class="fld row2">
      <div class="fld"><label>Start date</label><input type="date" id="sc-start"></div>
      <div class="fld"><label>Duration (days)</label><input type="number" id="sc-dur" value="5" min="1"></div>
    </div>
    <div id="sc-note" style="font-size:11.5px;color:var(--ink-faint);line-height:1.4"></div>
  </div>
  <div class="sfoot">
    <button class="btn" id="sc-cancel">Cancel</button>
    <button class="btn primary" id="sc-add">Add to schedule</button>
  </div>
</div></div>

const ST_DOT={"In Progress":"var(--prog)","Waiting Parts":"var(--wait)","At SRL":"var(--srl)","Done":"var(--done)"};
let sb=null, cloud=false, jobs=[], view="table", applyingRemote=false, myTag=Math.random().toString(36).slice(2);
const collapsed={};

function setSync(s){const d=document.getElementById('syncDot'),i=d.querySelector('i'),t=document.getElementById('syncTxt');
  const m={live:['#5fae7e','live'],saving:['#f5c518','saving…'],local:['#6b7883','local only'],offline:['#c9556a','offline']};
  const[c,x]=m[s]||m.local;i.style.background=c;t.textContent=x;}
let noteT;function flash(m){const e=document.getElementById('saveNote');e.textContent=m;clearTimeout(noteT);noteT=setTimeout(()=>e.textContent="",1500);}

/* ---------- load / seed ---------- */
async function load(){
  jobs=structuredClone(SEED_JOBS);
  try{
    if(window.supabase){
      sb=window.supabase.createClient(SB_URL,SB_ANON,{realtime:{params:{eventsPerSecond:4}}});
      const {count,error:cErr}=await sb.from('sched_jobs').select('*',{count:'exact',head:true});
      if(cErr) throw cErr;
      if(!count){ await seedCloud(); }        // empty table -> push seed
      else { await pullAll(); }
      cloud=true; setSync('live'); subscribe();
      return;
    }
  }catch(e){ console.warn('cloud unavailable:',e.message); cloud=false; setSync('local'); }
}
async function seedCloud(){
  setSync('saving');
  // insert in chunks of 200
  for(let i=0;i<jobs.length;i+=200){
    const chunk=jobs.slice(i,i+200).map(toRow);
    const {error}=await sb.from('sched_jobs').insert(chunk);
    if(error){console.warn('seed chunk failed',error.message);break;}
  }
  setSync('live');
}
async function pullAll(){
  let all=[],from=0,step=1000;
  while(true){
    const {data,error}=await sb.from('sched_jobs').select('*').range(from,from+step-1);
    if(error){console.warn('pull failed',error.message);break;}
    all=all.concat(data); if(data.length<step)break; from+=step;
  }
  if(all.length) jobs=all.map(fromRow);
}
function toRow(j){return {id:j.id,machine:j.machine,gantry:j.gantry,no:j.no,descr:j.descr,system:j.system,comments:j.comments,loc:j.loc,status:j.status,sched_id:j.sched_id||null,signed_by:j.signed_by||null,signed_at:j.signed_at||null};}
function fromRow(r){return {id:r.id,machine:r.machine,gantry:r.gantry,no:r.no,descr:r.descr,system:r.system,comments:r.comments,loc:r.loc,status:r.status,sched_id:r.sched_id||null,signed_by:r.signed_by||null,signed_at:r.signed_at||null};}

function subscribe(){
  sb.channel('jobs').on('postgres_changes',{event:'*',schema:'public',table:'sched_jobs'},payload=>{
    if(payload.new&&payload.new.tag===myTag)return;
    applyingRemote=true;
    if(payload.eventType==='DELETE'){ jobs=jobs.filter(j=>j.id!==payload.old.id); }
    else{ const r=fromRow(payload.new); const i=jobs.findIndex(j=>j.id===r.id); if(i>=0)jobs[i]=r; else jobs.push(r); }
    renderAll(); applyingRemote=false; flash('Updated');
  }).subscribe(st=>{if(st==='SUBSCRIBED')setSync('live');});
}

/* ---------- persist one job ---------- */
let saveT2;
async function saveJob(j){
  if(applyingRemote)return;
  if(cloud&&sb){
    setSync('saving');
    const row=toRow(j); row.tag=myTag; row.updated_at=new Date().toISOString();
    const {error}=await sb.from('sched_jobs').upsert(row);
    if(error){setSync('offline');flash('save failed');} else {setSync('live');flash('Saved ✓');}
  }else{flash('Saved (local)');}
}
async function deleteJob(id){
  jobs=jobs.filter(j=>j.id!==id);
  if(cloud&&sb){ await sb.from('sched_jobs').delete().eq('id',id); }
  renderAll();
}

/* ---------- filtering ---------- */
function filtered(){
  const m=fMachine.value,g=fGantry.value,sy=fSystem.value,st=fStatus.value,q=fSearch.value.trim().toLowerCase();
  return jobs.filter(j=>
    (!m||j.machine===m)&&(!g||j.gantry===g)&&(!sy||j.system===sy)&&(!st||j.status===st)&&
    (!q||(j.descr||'').toLowerCase().includes(q)||(j.comments||'').toLowerCase().includes(q)||(j.no||'').toLowerCase().includes(q)));
}

/* ---------- metrics + filter options ---------- */
function renderMeta(){
  const f=filtered();
  document.getElementById('m-total').textContent=f.length;
  document.getElementById('m-prog').textContent=f.filter(j=>j.status==='In Progress').length;
  document.getElementById('m-wait').textContent=f.filter(j=>j.status==='Waiting Parts').length;
  document.getElementById('m-srl').textContent=f.filter(j=>j.status==='At SRL').length;
  document.getElementById('m-done').textContent=f.filter(j=>j.status==='Done').length;
  document.getElementById('jobTotal').textContent='/ '+jobs.length+' total';
}
function fillFilterOptions(){
  const gset=[...new Set(jobs.map(j=>j.gantry))].sort();
  const sset=[...new Set(jobs.map(j=>j.system))].sort();
  const keepG=fGantry.value,keepS=fSystem.value;
  fGantry.innerHTML='<option value="">All gantries</option>'+gset.map(g=>`<option>${g}</option>`).join('');
  fSystem.innerHTML='<option value="">All systems</option>'+sset.map(s=>`<option>${esc(s)}</option>`).join('');
  fGantry.value=keepG; fSystem.value=keepS;
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- TABLE view ---------- */
let sortKey='gantry',sortDir=1;
function renderTable(){
  const rows=filtered().sort(cmp);
  if(!rows.length){document.getElementById('viewTable').innerHTML='<div class="empty">No jobs match these filters.</div>';return;}
  const table=`<div class="tbl-wrap"><table class="jt">
    <thead><tr>
      <th data-k="machine">M/C</th><th data-k="gantry">Gantry</th><th data-k="no">#</th>
      <th data-k="descr">Description</th><th data-k="system">System</th>
      <th data-k="comments">Comments</th><th data-k="status">Status</th><th></th>
    </tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table></div>`;
  const cards=`<div class="cardlist">${rows.map(cardHtml).join('')}</div>`;
  const c=document.getElementById('viewTable'); c.innerHTML = table+cards;
  c.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}renderTable();});
  wireRowEdit(c); wireCards(c);
}
function cardHtml(j){
  return `<div class="jcard" data-id="${j.id}" data-s="${j.status}">
    <div class="jc-top"><span class="jc-id">${esc(j.gantry)} · ${esc(j.no)}<span class="mtag m${j.machine}">${j.machine}</span></span>
      <span class="st ${ST_CLASS[j.status]}">${j.status}</span></div>
    <div class="jc-desc">${esc(j.descr)}</div>
    <div class="jc-meta"><span class="jc-sys">${esc(j.system)}</span></div>
  </div>`;
}
function wireCards(root){
  root.querySelectorAll('.jcard').forEach(card=>card.onclick=()=>{const j=jobs.find(x=>x.id===card.dataset.id);if(j)openSheet(j);});
}
function rowHtml(j){
  return `<tr data-id="${j.id}">
    <td><span class="mtag m${j.machine}">${j.machine}</span></td>
    <td><span class="gtag">${esc(j.gantry)}</span></td>
    <td contenteditable data-f="no">${esc(j.no)}</td>
    <td contenteditable data-f="descr">${esc(j.descr)}</td>
    <td contenteditable data-f="system" class="sysm">${esc(j.system)}</td>
    <td contenteditable data-f="comments" class="comm">${esc(j.comments)}</td>
    <td><button class="st ${ST_CLASS[j.status]}" data-cy>${j.status}</button></td>
    <td><button class="xbtn" data-del>✕</button></td></tr>`;
}
function wireRowEdit(root){
  root.querySelectorAll('td[contenteditable]').forEach(td=>{
    td.onblur=()=>{const tr=td.closest('tr');const j=jobs.find(x=>x.id===tr.dataset.id);if(!j)return;const f=td.dataset.f;const v=td.innerText.trim();if(j[f]!==v){j[f]=v;saveJob(j);}};
    td.onkeydown=e=>{if(e.key==='Enter'&&td.dataset.f!=='comments'){e.preventDefault();td.blur();}};
  });
  root.querySelectorAll('[data-cy]').forEach(b=>b.onclick=()=>{const tr=b.closest('tr');const j=jobs.find(x=>x.id===tr.dataset.id);cycleStatus(j);});
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const tr=b.closest('tr');if(confirm('Delete this job?'))deleteJob(tr.dataset.id);});
}
function cycleStatus(j){const i=STATUSES.indexOf(j.status);j.status=STATUSES[(i+1)%STATUSES.length];j.loc=j.status==='Done'?'Completed':j.status==='In Progress'?'Newcastle':j.status==='At SRL'?'SRL':'Waiting On Parts';saveJob(j);renderAll();}
function cmp(a,b){let x=a[sortKey]||'',y=b[sortKey]||'';if(sortKey==='no'){x=+x||0;y=+y||0;}if(x<y)return -1*sortDir;if(x>y)return 1*sortDir;return 0;}

/* ---------- GROUPED view ---------- */
const GORDER=["BR1","G1","G2","BR2","G3","G4","G5","G6","G7","G8","G9"];
function renderGrouped(){
  const f=filtered();
  const byG={};
  f.forEach(j=>{(byG[j.gantry]=byG[j.gantry]||[]).push(j);});
  const gantries=Object.keys(byG).sort((a,b)=>{const ia=GORDER.indexOf(a),ib=GORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  const c=document.getElementById('viewGrouped');
  if(!f.length){c.innerHTML='<div class="empty">No jobs match these filters.</div>';return;}
  c.innerHTML=gantries.map(g=>{
    const list=byG[g];const done=list.filter(j=>j.status==='Done').length;const pct=Math.round(done/list.length*100);
    const isC=collapsed[g];
    return `<div class="grp ${isC?'collapsed':''}" data-g="${g}">
      <div class="grp-h"><span class="gname">${esc(g)}</span>
        <span class="gcount">${done}/${list.length} done</span>
        <div class="gbar"><i style="width:${pct}%"></i></div><span class="gpct">${pct}%</span>
        <span class="chev">▾</span></div>
      <div class="grp-body">
        <table class="jt"><tbody>
        ${list.sort((a,b)=>(+a.no||0)-(+b.no||0)).map(rowHtml).join('')}
        </tbody></table>
        <div class="cardlist" style="padding:8px">
        ${list.sort((a,b)=>(+a.no||0)-(+b.no||0)).map(cardHtml).join('')}
        </div>
      </div></div>`;
  }).join('');
  c.querySelectorAll('.grp-h').forEach(h=>h.onclick=e=>{if(e.target.closest('td,button,[contenteditable]'))return;const g=h.closest('.grp').dataset.g;collapsed[g]=!collapsed[g];h.closest('.grp').classList.toggle('collapsed');});
  wireRowEdit(c); wireCards(c);
}

/* ---------- KANBAN view ---------- */
function renderKanban(){
  const f=filtered();
  const c=document.getElementById('viewKanban');
  c.innerHTML='<div class="kb">'+STATUSES.map(s=>{
    const list=f.filter(j=>j.status===s);
    return `<div class="kcol" data-s="${s}">
      <div class="kcol-h"><div class="kt"><span class="kdot" style="background:${ST_DOT[s]}"></span>${s}</div><div class="kn">${list.length}</div></div>
      <div class="kbody">${list.map(j=>`
        <div class="kcard" draggable="true" data-id="${j.id}" data-s="${j.status}">
          <div class="kh"><span class="kg">${esc(j.gantry)} · ${esc(j.no)}</span><span class="ks"><span class="mtag m${j.machine}">${j.machine}</span></span></div>
          <div class="kd">${esc(j.descr)}</div></div>`).join('')}</div></div>`;
  }).join('')+'</div>';
  // drag
  let dragId=null;
  c.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart',()=>{dragId=card.dataset.id;card.classList.add('drag');});
    card.addEventListener('dragend',()=>{dragId=null;card.classList.remove('drag');});
  });
  c.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over');});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');if(!dragId)return;
      const j=jobs.find(x=>x.id===dragId);if(!j)return;const ns=col.dataset.s;if(j.status!==ns){j.status=ns;j.loc=ns==='Done'?'Completed':ns==='In Progress'?'Newcastle':ns==='At SRL'?'SRL':'Waiting On Parts';saveJob(j);renderAll();}
    });
  });
}

/* ---------- render dispatch ---------- */
function renderAll(){
  fillFilterOptions(); renderMeta();
  document.getElementById('viewTable').style.display=view==='table'?'block':'none';
  document.getElementById('viewGrouped').style.display=view==='grouped'?'block':'none';
  document.getElementById('viewKanban').style.display=view==='kanban'?'block':'none';
  if(view==='table')renderTable(); else if(view==='grouped')renderGrouped(); else renderKanban();
}

/* ---------- add / export ---------- */
let sheetJob=null; // null = adding new, else editing this job
let sheetStatus='In Progress';

function openSheet(job){
  sheetJob=job;
  const known=[...new Set([...GORDER, ...jobs.map(j=>j.gantry)])];
  const gsel=document.getElementById('sh-gantry');
  gsel.innerHTML=known.map(g=>`<option>${esc(g)}</option>`).join('');
  if(job){
    document.getElementById('sh-title').textContent='Edit '+job.gantry+' · '+(job.no||'');
    document.getElementById('sh-machine').value=job.machine;
    gsel.value=job.gantry;
    document.getElementById('sh-no').value=job.no||'';
    document.getElementById('sh-descr').value=job.descr||'';
    document.getElementById('sh-system').value=job.system||'';
    document.getElementById('sh-comments').value=job.comments||'';
    sheetStatus=job.status||'In Progress';
    document.getElementById('sh-delete').style.display='block';
    document.getElementById('sh-sched').style.display='block';
    document.getElementById('sh-sched').textContent = job.sched_id ? '✓ On schedule (update)' : '→ Add to schedule';
  }else{
    document.getElementById('sh-title').textContent='Add job';
    document.getElementById('sh-machine').value=fMachine.value||'1430';
    gsel.value=fGantry.value||known[0];
    document.getElementById('sh-no').value='';
    document.getElementById('sh-descr').value='';
    document.getElementById('sh-system').value='';
    document.getElementById('sh-comments').value='';
    sheetStatus='In Progress';
    document.getElementById('sh-delete').style.display='none';
    document.getElementById('sh-sched').style.display='none';
  }
  drawStatusBtns();
  document.getElementById('sheetScrim').classList.add('on');
}
function drawStatusBtns(){
  document.querySelectorAll('#sh-statusrow .stbtn').forEach(b=>b.classList.toggle('on',b.dataset.st===sheetStatus));
}
function closeSheet(){document.getElementById('sheetScrim').classList.remove('on');sheetJob=null;}
function saveSheet(){
  const loc = sheetStatus==='Done'?'Completed':sheetStatus==='In Progress'?'Newcastle':sheetStatus==='At SRL'?'SRL':'Waiting On Parts';
  const data={
    machine:document.getElementById('sh-machine').value,
    gantry:document.getElementById('sh-gantry').value,
    no:document.getElementById('sh-no').value.trim(),
    descr:document.getElementById('sh-descr').value.trim()||'New job',
    system:document.getElementById('sh-system').value.trim()||'Other',
    comments:document.getElementById('sh-comments').value.trim(),
    loc, status:sheetStatus
  };
  if(sheetJob){
    Object.assign(sheetJob,data); saveJob(sheetJob);
    flash('Saved ✓');
  }else{
    const j={id:'j'+Date.now().toString(36),...data};
    jobs.push(j); saveJob(j);
    if(fMachine.value && fMachine.value!==j.machine) fMachine.value=j.machine;
    if(fGantry.value && fGantry.value!==j.gantry) fGantry.value=j.gantry;
    flash('Job added ✓');
  }
  closeSheet(); renderAll();
}
function addJob(){ openSheet(null); }

function exportXlsx(){
  if(typeof XLSX==='undefined'){alert('Excel library still loading — check your connection and try again in a moment.');return;}
  const f=filtered();
  const rows=f.map(j=>({Machine:j.machine,Gantry:j.gantry,'#':j.no,Description:j.descr,System:j.system,Comments:j.comments,Status:j.status}));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:8},{wch:8},{wch:5},{wch:55},{wch:18},{wch:35},{wch:14}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Hitlist');
  XLSX.writeFile(wb,'S1429-30_Hitlist_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

/* ---------- wire controls ---------- */
document.getElementById('viewSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;document.querySelectorAll('#viewSeg button').forEach(x=>x.classList.toggle('on',x===b));renderAll();};
['fMachine','fGantry','fSystem','fStatus'].forEach(id=>document.getElementById(id).onchange=renderAll);
document.getElementById('fSearch').oninput=()=>{clearTimeout(saveT2);saveT2=setTimeout(renderAll,180);};
document.getElementById('addJob').onclick=addJob;
/* ========== bridge: add hitlist job to the schedule board ========== */
const SCHED_BOARD_ID="s1430";
const SCHED_CREWS_FALLBACK=[
  {id:"A",name:"Crew A"},{id:"B",name:"Crew B"},{id:"C",name:"Crew C"},
  {id:"D",name:"Crew D"},{id:"E",name:"Crew E"}
];
let schedBoardCache=null;
async function readSchedBoard(){
  if(!(cloud&&sb)) return null;
  const {data,error}=await sb.from('sched_boards').select('data').eq('id',SCHED_BOARD_ID).maybeSingle();
  if(error){console.warn('read board',error.message);return null;}
  return data?data.data:null;
}
async function writeSchedBoard(board){
  if(!(cloud&&sb)) return false;
  const {error}=await sb.from('sched_boards').upsert({id:SCHED_BOARD_ID,data:board,tag:'hitlist-'+myTag,updated_at:new Date().toISOString()});
  if(error){console.warn('write board',error.message);return false;}
  return true;
}

let schedTargetJob=null;
async function openSchedModal(job){
  schedTargetJob=job;
  document.getElementById('sc-jobname').textContent=job.gantry+' · '+(job.no||'')+' — '+(job.descr||'');
  // crews from the live board if we can read it, else fallback
  schedBoardCache=await readSchedBoard();
  const crews = (schedBoardCache&&Array.isArray(schedBoardCache.crews)&&schedBoardCache.crews.length)?schedBoardCache.crews:SCHED_CREWS_FALLBACK;
  const csel=document.getElementById('sc-crew');
  csel.innerHTML=crews.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  // default start = today
  document.getElementById('sc-start').value=new Date().toISOString().slice(0,10);
  document.getElementById('sc-dur').value=5;
  document.getElementById('sc-note').textContent = schedBoardCache? 'This adds a dated job onto the schedule board, linked to this hitlist job.' : 'Schedule board not reachable — check connection.';
  document.getElementById('schedScrim').classList.add('on');
}
function closeSchedModal(){document.getElementById('schedScrim').classList.remove('on');schedTargetJob=null;}

async function confirmAddToSchedule(){
  const job=schedTargetJob; if(!job) return;
  const board=schedBoardCache||await readSchedBoard();
  if(!board){alert('Could not reach the schedule board. Try again when online.');return;}
  if(!Array.isArray(board.gantries)) board.gantries=[];
  const crewId=document.getElementById('sc-crew').value;
  const startISO=document.getElementById('sc-start').value;
  const dur=Math.max(1,+document.getElementById('sc-dur').value||5);
  // compute day index from board's project start
  const projStart=new Date((board.startISO||startISO)+"T00:00:00");
  const startIdx=Math.max(0,Math.round((new Date(startISO+"T00:00:00")-projStart)/86400000));
  // build linked schedule job (id shared for the two-way link)
  const linkId = job.sched_id || ('h'+job.id);
  // remove any existing copy with same link, then add fresh
  board.gantries=board.gantries.filter(g=>g.id!==linkId);
  board.gantries.push({
    id: linkId,
    crew: crewId,
    start: startIdx,
    dur: dur,
    pri: 'norm',
    scope: (job.gantry+' · '+(job.system||'')+' — '+(job.descr||'')).slice(0,120),
    jobs: [{t:(job.descr||'Job'), done: job.status==='Done'}],
    srcJobId: job.id           // link back to the hitlist job
  });
  const ok=await writeSchedBoard(board);
  if(!ok){alert('Failed to write to schedule.');return;}
  // stamp the hitlist job with the link
  job.sched_id=linkId; saveJob(job);
  closeSchedModal(); closeSheet(); renderAll();
  flash('Added to schedule ✓');
}

document.getElementById('sh-sched').onclick=()=>{ if(sheetJob) openSchedModal(sheetJob); };
document.getElementById('sc-cancel').onclick=closeSchedModal;
document.getElementById('sc-close').onclick=closeSchedModal;
document.getElementById('sc-add').onclick=confirmAddToSchedule;
document.getElementById('schedScrim').addEventListener('click',e=>{if(e.target.id==='schedScrim')closeSchedModal();});

document.getElementById('sh-save').onclick=saveSheet;
document.getElementById('sh-cancel').onclick=closeSheet;
document.getElementById('sh-close').onclick=closeSheet;
document.getElementById('sh-delete').onclick=()=>{if(sheetJob&&confirm('Delete this job?')){deleteJob(sheetJob.id);closeSheet();}};
document.getElementById('sheetScrim').addEventListener('click',e=>{if(e.target.id==='sheetScrim')closeSheet();});
document.querySelectorAll('#sh-statusrow .stbtn').forEach(b=>b.onclick=()=>{sheetStatus=b.dataset.st;drawStatusBtns();});
document.getElementById('exportXlsx').onclick=exportXlsx;
document.getElementById('foot').innerHTML="Hitlist of all S-1429 and S-1430 jobs imported from the site workbook. Three views — Table (sortable, inline-editable), Grouped by gantry (with completion %), and Kanban by status (drag to change). Filter by machine, gantry, system, status or search. Edits sync live between devices via Supabase; the Excel button exports whatever's currently filtered. Status buckets: In Progress (Newcastle) · Waiting Parts · At SRL · Done (Completed).";

(async function(){ await load(); renderAll(); })();
